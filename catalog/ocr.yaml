_meta:
  verified_on: '2026-10-28'
  note: 'Fiches OCR : modèles de lecture de documents, moteurs OCR classiques, chaînes de conversion.
    Édité à la main ; affiché dans l''onglet OCR (pipeline/build_site.py).'
licence_classes:
  libre: Licence libre (Apache-2.0, MIT…) sans restriction d’usage.
  conditions: Gratuit sous conditions (plafond de chiffre d’affaires, contrat complémentaire, copyleft
    fort).
  non_commercial: Recherche ou usage non commercial seulement.
  non_declaree: Aucune licence déclarée sur les poids.
  exclue_ue: Licence inapplicable dans l’Union européenne.
  proprietaire: Service propriétaire, poids fermés.
docling_est_il_un_ocr:
  reponse: Non. Docling est une chaine de conversion. Il fait lui-meme la lecture de la couche texte,
    l'analyse de mise en page, la structure des tableaux et l'export. Il delegue la reconnaissance des
    caracteres a un moteur OCR externe, ou la page entiere a un VLM.
  sources:
  - https://github.com/docling-project/docling/blob/main/docs/concepts/OCR.md
  - https://github.com/docling-project/docling/blob/main/docling/datamodel/pipeline_options.py
  - https://github.com/docling-project/docling/blob/main/docs/getting_started/installation.md
