_meta:
  verified_on: '2026-10-28'
  note: 'Benchmarks OCR et scores. provenance : officiel = mesuré par l''auteur du benchmark ; editeur
    = publié par l''éditeur du modèle ; tiers = mesuré par un autre acteur (OpenBMB, LightOn…). Un score
    éditeur ou tiers n''est retenu que si le classement officiel n''en a pas.'
benchmarks:
- id: omnidocbench
  categorie: Documents variés
  nom: OmniDocBench v1.6
  unite: /100
  court: 'Convertir des pages entières en Markdown : texte, formules, tableaux, sur dix types de documents.'
  evalue: 'Le modèle reçoit une page (article, rapport financier, journal, manuel, notes manuscrites…)
    et doit la restituer en Markdown : le texte, les formules en LaTeX, les tableaux en HTML, dans le
    bon ordre de lecture.'
  comment: '1 651 pages en anglais et en chinois. Score global sur 100 : moyenne de la justesse du texte
    (distance d''édition), des formules (CDM) et des tableaux (TEDS). Les versions 1.5 et 1.6 ne sont
    pas comparables entre elles.'
  pourquoi: La référence pour la conversion de documents ; mais pas de français, et la tête du classement
    est trop serrée (moins d'un point) pour désigner un vainqueur.
  auteur: OpenDataLab (Shanghai AI Laboratory) — Ouyang et al.
  article: https://arxiv.org/abs/2412.07626
  classement: https://github.com/opendatalab/OmniDocBench#end-to-end-evaluation
  mis_a_jour: '2026-09-11'
  juge_et_partie:
  - mineru2.5-pro
  - mineru
  conflit_note: OpenDataLab publie aussi MinerU (MinerU2.5, MinerU2.5-Pro, MinerU-Pipeline) présent au
    classement.
  francais: false
  verified_on: '2026-10-28'
- id: real5-omnidocbench
  categorie: Scans et photos
  nom: Real5-OmniDocBench
  unite: /100
  court: 'Les mêmes pages réimprimées puis scannées ou photographiées : gondolées, de travers, mal éclairées.'
  evalue: 'Les 1 355 pages d''OmniDocBench v1.5 sont imprimées puis recapturées dans cinq conditions réelles
    : scan, page gondolée, photo d''écran, éclairage difficile, inclinaison.'
  comment: 6 775 images. Même calcul qu'OmniDocBench v1.5, moyenné sur les cinq conditions. Comparable
    dans le temps, pas avec OmniDocBench v1.6.
  pourquoi: Le plus proche de documents scannés ou pris au téléphone ; l'écart avec la version propre
    montre la robustesse d'un modèle.
  auteur: PaddlePaddle (Baidu) — Zhou et al.
  article: https://arxiv.org/abs/2603.04205
  classement: https://huggingface.co/datasets/PaddlePaddle/Real5-OmniDocBench#leaderboard
  mis_a_jour: '2026-10-23'
  juge_et_partie:
  - paddleocr-vl-1.6
  - paddleocr
  conflit_note: PaddlePaddle publie PaddleOCR-VL, 1er du classement (PaddleOCR-VL-1.6, 93.19).
  francais: false
  verified_on: '2026-10-28'
- id: olmocr-bench
  categorie: Documents PDF difficiles
  nom: olmOCR-Bench
  unite: '%'
  court: 'Plus de 7 000 tests automatiques sur des PDF difficiles : vieux scans, tableaux, petit texte,
    colonnes.'
  evalue: 'Chaque page convertie est vérifiée par des tests simples : telle phrase est-elle présente,
    l''en-tête a-t-il bien été retiré, ces deux passages sont-ils dans le bon ordre, ces cellules de tableau
    sont-elles bien reliées.'
  comment: '1 403 PDF d''une page en anglais, 7 010 tests. Score : moyenne des taux de réussite de huit
    catégories. Le classement officiel d''Ai2 est figé depuis le 06/11/2025 : les modèles récents n''y
    sont que par leurs propres chiffres.'
  pourquoi: Des tests lisibles et vérifiables, proches de l'extraction d'information ; mais un classement
    officiel ancien et une partie des scores fournis par les éditeurs.
  auteur: Allen Institute for AI (Ai2) — Poznanski et al.
  article: https://arxiv.org/abs/2502.18443
  classement: https://github.com/allenai/olmocr/blob/main/olmocr/bench/README.md#results
  mis_a_jour: '2025-11-06'
  juge_et_partie:
  - olmocr-2
  conflit_note: Ai2 publie olmOCR, présent au classement.
  francais: false
  verified_on: '2026-10-28'
- id: mdpbench
  categorie: Multilingue
  nom: MDPBench (17 langues)
  unite: /100
  court: Documents numériques et photographiés en 17 langues, dont le français.
  evalue: Même exercice qu'OmniDocBench (texte, formules, tableaux vers Markdown), sur des documents en
    17 langues à écriture latine ou non, en version numérique et en photo.
  comment: 3 400 images. Score sur 100 par page, moyenné. Une partie des pages reste privée pour éviter
    que les modèles s'entraînent dessus.
  pourquoi: Le seul grand classement qui mesure d'autres langues que l'anglais et le chinois ; utile pour
    des documents européens.
  auteur: HUST (Yuliang Liu, Xiang Bai) — Li, Lin et al.
  article: https://arxiv.org/abs/2603.28130
  classement: https://huggingface.co/spaces/Delores-Lin/MDPBench-leaderboard
  mis_a_jour: '2026-10-28'
  juge_et_partie:
  - monkeyocrv2-b-parsing
  conflit_note: Le laboratoire publie MonkeyOCR ; MonkeyOCRv2-B/S sont 1er et 3e des modèles spécialisés
    ouverts.
  francais: true
  verified_on: '2026-10-28'
- id: mdpbench-fr
  categorie: Français
  nom: MDPBench — colonne français
  unite: /100
  court: Le sous-score français de MDPBench.
  evalue: Les pages en français de MDPBench, numériques et photographiées, converties en Markdown.
  comment: Sous-score publié par les auteurs de MDPBench pour chaque modèle ; même calcul que le score
    global.
  pourquoi: Le chiffre le plus direct pour des documents français courants ; le nombre de pages françaises
    n'est pas publié.
  auteur: HUST (Yuliang Liu, Xiang Bai) — Li, Lin et al.
  article: https://arxiv.org/abs/2603.28130
  classement: https://huggingface.co/spaces/Delores-Lin/MDPBench-leaderboard
  mis_a_jour: '2026-10-28'
  juge_et_partie:
  - monkeyocrv2-b-parsing
  conflit_note: Le laboratoire publie MonkeyOCR ; MonkeyOCRv2-B/S sont 1er et 3e des modèles spécialisés
    ouverts.
  francais: true
  verified_on: '2026-10-28'
- id: fr-bench-pdf2md
  categorie: Français
  nom: fr-bench-pdf2md
  unite: /100
  court: 'Pages françaises difficiles : formulaires manuscrits, manuscrits, tableaux longs, petit texte.'
  evalue: 'Des pages françaises choisies là où les modèles se contredisaient, tirées de 60 000 documents
    (dont Gallica) : formulaires remplis à la main, manuscrits, tableaux longs, colonnes, petit texte,
    graphiques.'
  comment: Tests automatiques à la manière d'olmOCR-Bench, publiés de 0 à 1 et ramenés ici sur 100. Mode
    de calcul du score global non documenté. Classement mis à jour le 25/02/2026.
  pourquoi: Le meilleur indicateur pour des documents administratifs français ; publié par des filiales
    de La Poste, sans modèle maison au classement.
  auteur: Probayes et OpenValue (filiales de La Poste) — Rigal et al.
  article: https://arxiv.org/abs/2602.11960
  classement: https://github.com/ld-lab-pulsia/benchpdf2md#results
  mis_a_jour: '2026-02-25'
  juge_et_partie: []
  conflit_note: Aucun modèle maison au classement.
  francais: true
  verified_on: '2026-10-28'
rejected:
- benchmark: Wild-OmniDocBench
  motif: 'Pas de classement : seulement cinq résultats tirés de l''article.'
- benchmark: CHAOS-Bench
  motif: Pas de classement officiel ; les chiffres circulant sont calculés par OpenBMB avec sa propre
    méthode.
- benchmark: OCRBench v2
  motif: Questions-réponses sur images, pas de conversion de documents ; classement sur un jeu privé,
    non comparable aux chiffres publiés sur le jeu public.
- benchmark: OCRBench (v1)
  motif: Classement figé depuis juin 2025, limité à d'anciens modèles.
- benchmark: CC-OCR
  motif: Classement figé depuis novembre 2024.
- benchmark: Fox
  motif: Pas de classement tenu à jour.
- benchmark: READoc
  motif: Pas de classement tenu à jour.
- benchmark: PubTabNet (et la métrique TEDS)
  motif: Tableaux seulement, proche du plafond ; sa métrique (TEDS) est reprise par OmniDocBench.
