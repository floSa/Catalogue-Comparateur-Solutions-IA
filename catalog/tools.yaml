    (Discord, iMessage, Slack, Teams, Telegram, WhatsApp…), pas l''éditeur ni le terminal. Il se place
    au-dessus des harnais, qu''il branche comme greffons (Claude, Codex, modèles locaux). Il sort donc
    de la couche 1 telle que le référentiel la définit. Libre sous MIT.'
