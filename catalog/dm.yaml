benchmarks:
- id: jev-decision-index
  nom: Jev Decision Index
  edition: Decision Index 0.4.1
  categorie: indice composite (tests privés)
  court: Classement communautaire, tenu sur Hugging Face, des reproductions ouvertes de Jev, noté sur
    des tests privés.
  evalue: 'Une suite publique de 37 jeux de données en cinq domaines : Knowledge & Reasoning (11), Language
    Understanding (9), Retrieval & Classification (6), Tools & Automation (5) et Arts & Human Taste (6).
    Il s''y ajoute des tests privés des mêmes compétences et des tâches privées de domaines nouveaux,
    jamais publiés. Les reproductions sont rejouées sur 1 × NVIDIA RTX PRO 6000 ; Jev 1.14 est mesuré
    par son API.'
  comment: 'Full score (depuis la 0.4 du 2026-10-19) = 0,60 × tests privés « same-skill » + 0,40 × tâches
    privées « new-domain ». Chaque partie est ramenée sur l''échelle de l''index public grâce à 21 modèles
    de base non réglés : être à un écart-type au-dessus de leur moyenne vaut le même score sur chaque
    partie. Chaque jeu est corrigé du hasard, (score − hasard) / (1 − hasard) borné entre 0 et 1, et une
    requête sans réponse compte comme fausse. L''index public reste affiché, mais il ne compte plus dans
    le Full score. Bandes d''égalité : les modèles à moins de 0,9 point du premier de leur groupe partagent
    son rang (affiché « =n ») ; le groupe suivant prend le numéro suivant, donc les rangs comptent des
    groupes et non des modèles. Selon la méthodologie, 0,9 point est l''écart qu''un nouvel échantillon
    de questions pourrait produire, 95 fois sur 100, entre deux modèles voisins.'
  pourquoi: 'C''est le plus large classement des modèles de décision ouverts (243 entrées au 2026-10-28)
    : tous mesurés sur la même machine, sur des tests sur lesquels personne n''a pu s''entraîner, avec
    des égalités déclarées. Il ne dit pas : il ne donne aucun coût ; la latence de Jev (aller-retour HTTP)
    n''est pas comparable à celle des reproductions (temps GPU en processus) ; les tâches privées ne peuvent
    pas être inspectées ; parmi les modèles fermés, seul Jev y figure.'
  auteur: 'multimodalart (Space Hugging Face, communautaire, « not affiliated with TypeSafe AI ») ; code
    de l''index : github.com/apolinario/decision-index'
  classement: https://huggingface.co/spaces/multimodalart/jev-decision-index
  article: https://huggingface.co/spaces/multimodalart/jev-decision-index/resolve/main/methodology.html
  mis_a_jour: '2026-10-28'
  juge_et_partie: false
  licence_donnees: Non indiquée dans le README du Space ; le code de l'index (apolinario/decision-index)
    est sous MIT.
  verified_on: '2026-10-28'
- id: jevbench
  nom: JevBench (Benchmark Heaven)
  edition: v1.7.15
  categorie: exactitude, calibration, coût, latence
  court: Banc d'essai indépendant de Benchmark Heaven qui mesure les modèles de décision sur l'exactitude,
    la calibration, la vitesse et le coût.
  evalue: Chaque version pose 1 500 décisions (1 200 scellées et 300 publiques) des trois types choice,
    noul (oui/non) et score, réparties en niveaux easy, standard, hard et judge, et en domaines métier
    (règles, code, finance, support, routage de modèles…). Les modèles ouverts tournent hors ligne sur
    des machines louées par l'évaluateur ; les API sont mesurées de bout en bout et classées sur un tableau
    séparé.
  comment: 'Le score de tête, Capability, est la moyenne d''Intelligence et de Calibration. Intelligence
    est une compétence corrigée du hasard : types de question à poids égal ; niveaux pondérés easy 0,1,
    standard 0,2, hard 0,4, judge 0,3 ; moitié items publics, moitié scellés ; pénalité si le score public
    dépasse le scellé de plus de l''écart médian + 8 points. Le rang officiel ne va qu''aux modèles sous
    deux plafonds : 2 × le coût et 2 × la latence médiane de Jev 1.13.0 mesuré en v1.5 (0,0646 $ pour
    1 000 décisions, 1,23 s). Depuis la v1.7.0, une décision de plus de 10 s compte comme fausse. Le Composite,
    secondaire, est une moyenne harmonique pondérée (25 % chacun) d''Intelligence, Calibration, Speed
    et Cost, avec des pénalités au carré sous les seuils.'
  pourquoi: 'C''est le seul classement qui mesure le coût et la latence dans les mêmes conditions pour
    plus de 250 modèles ouverts, avec des plafonds « classe Jev » qui reflètent un usage en production.
    Il ne dit pas : le coût d''un modèle ouvert est une estimation tirée du tarif de référence de son
    modèle de base ; la latence auto-hébergée est estimée (2 × p50 + 150 ms) ; des lignes de versions
    de méthode et de tirages différents coexistent (v1.6.x et v1.7.x, mesures d''ancrage en attente) ;
    les API voient les items scellés ; les éditeurs peuvent payer une mesure accélérée (« paid fast-lane
    »), sans effet déclaré sur le score.'
  auteur: Benchmark Heaven (projet de Florian Standhartinger, détenteur du copyright du dépôt fstandhartinger/jevbench)
  classement: https://benchmarkheaven.com/jev-models
  article: null
  mis_a_jour: '2026-10-28'
  juge_et_partie: false
  licence_donnees: MIT (licence déclarée dans le JSON-LD Dataset de la page, qui renvoie au LICENSE du
    dépôt fstandhartinger/jevbench)
  verified_on: '2026-10-28'
- id: aa-decision-index
  nom: Artificial Analysis Decision Index
  edition: v1.0
  categorie: indice composite
  court: Indice composite d'Artificial Analysis qui note les modèles de décision, et quelques LLM pour
    comparaison, sur quatre évaluations à réponse fermée.
  evalue: 'Il couvre la connaissance et l''hallucination (AA-Omniscience-Decision : 500 questions privées
    à cinq options dont « je ne sais pas »), le raisonnement (HLE-MultiChoice : 513 QCM texte de Humanity''s
    Last Exam), l''appel d''outils (When2Call de NVIDIA : 3 423 tâches) et la classification de sécurité
    (WildGuardTest : 835 lignes, trois questions oui/non). Les modèles de décision sont interrogés par
    leur API de décision ; les LLM reçoivent un prompt système fixe et répondent en JSON contraint (structured
    outputs).'
  comment: 'Indice = 0,125 × exactitude Omniscience + 0,125 × taux de non-hallucination + 0,25 × exactitude
    HLE-MultiChoice + 0,25 × exactitude When2Call + 0,25 × F1 moyen WildGuardTest, sur 0–100. Le taux
    de non-hallucination vaut 100 × (1 − part des questions ratées auxquelles le modèle a répondu faux
    plutôt que « je ne sais pas »). Pour un choix, la réponse est l''option de plus forte probabilité
    ; pour un oui/non, « oui » si P(oui) ≥ 0,5. Contrôle fait le 2026-10-28 : cette formule redonne les
    32 indices publiés (écart max 1,4e-14).'
  pourquoi: 'C''est le seul classement tiers qui met sur la même échelle les API fermées (Jev, d1-ultra,
    Microsoft-Decision-1, OpenAI Decisions) et des modèles ouverts, avec en plus le coût et le temps par
    tâche. Il ne dit pas : aucun intervalle de confiance n''est publié (0,25 point sépare d1-ultra de
    SubQ Snap 1.1, ce qui ne permet pas de les départager) ; trois des quatre jeux sont publics, donc
    un modèle a pu s''y entraîner ; les LLM sont mesurés avec un autre protocole (JSON contraint) que
    les modèles de décision ; seuls 17 modèles de décision y figurent ; aucune date de mesure par modèle
    n''est publiée.'
  auteur: Artificial Analysis
  classement: https://artificialanalysis.ai/evaluations/artificial-analysis-decision-index
  article: https://artificialanalysis.ai/methodology/decision-index
  mis_a_jour: null
  juge_et_partie: false
  licence_donnees: Non indiquée sur la page de classement ni sur la méthodologie (conditions d'utilisation
    d'Artificial Analysis non lues). Composante WildGuardTest dérivée de WildGuardMix (ODC-BY).
  verified_on: '2026-10-28'
rejected:
- benchmark: Decision Model Leaderboard de Cloudflare (clef-evals.workers-ai-mle.workers.dev)
  motif: Copie figée du Jev Decision Index 0.2.1 (instantané amont du 2026-09-28, données générées le
    2026-10-01), complétée par les scores de Clef auto-déclarés par Cloudflare ; les jeux non passés y
    valent 0. Juge et partie, et pas de mise à jour depuis le 1er…
- benchmark: TypeSafe Workflow evals (evals.typesafe.ai)
  motif: 'Évaluation de l''éditeur de Jev : seul Jev y figure comme modèle de décision, face à des LLM.
    Les étiquettes de référence sont la moyenne des réponses de grands LLM, et aucune date de mise à jour
    n''est publiée. Juge et partie, et ce n''est pas un classement des…'
- benchmark: Suites d’évaluation de Kev (github.com/jaredpalmer/kev, evals/)
  motif: Suites figées de l'auteur de Kev (decision-v7, transfer-v4, transfer-v9…) pour évaluer ses propres
    checkpoints. Il n'y a pas de classement public ; le Space jaredpalmer/kev n'est qu'une démo.
- benchmark: SR-Text / SR-Box (vLLM Semantic Router, fiche d3-ultra)
  motif: Tests privés de l'éditeur de d3, qui écrit lui-même « our own tests, not an official leaderboard
    ». Juge et partie, sans classement public. Les Spaces vllm-sr/Decision-3.0 et vllm-sr/d3-ultra sont
    des démos.
- benchmark: Sept suites d’Intern-Decision (Jevbench-Easy/Original/Hard, Typed Decision, ToolACE, AG…
  motif: 'Tableau de l''éditeur (fiche et arXiv 2610.22131, daté du 2026-10-15), sans classement public
    tenu à jour. Les « Jevbench » Easy/Original/Hard (48/72/111 items publics) ne sont pas identifiés
    comme le JevBench de Benchmark Heaven : lien non établi.'
- benchmark: Jev Decision Index — Vision board (cité par pplx-decider et d3)
  motif: Tableau intégré au Jev Decision Index (Full = 0,5 × public vision + 0,5 × privé même compétence),
    donc dans le périmètre que le mainteneur ingère lui-même. À ne pas compter comme un benchmark distinct.
- benchmark: Références de la fiche pplx-decider-v1.2 (BRIGHT, ToolRet, SATA-Bench…)
  motif: Jeux de données généraux, rejoués par l'éditeur et repris dans le Jev Decision Index. Ce ne sont
    pas des classements propres aux modèles de décision.
- benchmark: DecisionBench (43 tâches, 23 900 lignes)
  motif: Connu seulement par des publications LinkedIn de ses auteurs. Ni page de classement, ni dépôt,
    ni données primaires trouvés le 2026-10-28.
- benchmark: DecisionBench 1.0 (Hanno Labs)
  motif: 'Cité seulement par un guide tiers (llmconfigurator.com), sans source primaire trouvée. Selon
    ce guide, bâti par l''équipe du modèle évalué : juge et partie.'
- benchmark: BenchLM « Decision Models » (benchlm.ai/decision-models)
  motif: 'Agrégateur secondaire qui reprend des chiffres d''éditeurs (par exemple un graphique de lancement
    de Fastino) : ce n''est pas une source primaire.'
- benchmark: Tests de blogs (OneWave « 150 décisions », regolo.ai, HackerNoon)
  motif: 'Presse ou blogs d''entreprise : règle « pas de presse ».'
