benchmarks:
- id: epoch-eci
  nom: Epoch Capabilities Index
  categorie: Indice global
  unite: points ECI
  max: null
  mieux: haut
  auteur: Epoch AI
  provenance: Epoch AI, CC-BY 4.0
  court: Un seul chiffre qui résume plus de 50 benchmarks, avec son intervalle de confiance.
  evalue: 'La capacité générale du modèle, déduite de tous les benchmarks où il a été mesuré : mieux il
    réussit les benchmarks difficiles, plus son indice est haut.'
  comment: La difficulté de chaque benchmark est estimée statistiquement à partir des modèles mesurés
    sur plusieurs d'entre eux. Échelle linéaire calée sur Claude 3.5 Sonnet = 130 et GPT-5 = 150, sans
    maximum. Il faut au moins 4 benchmarks pour obtenir un indice.
  pourquoi: 'Le meilleur point de comparaison général entre petits modèles et avec les grands. Limite
    : Epoch ajoute les petits modèles avec plusieurs mois de retard.'
  classement: https://epoch.ai/benchmarks/eci
  article: https://arxiv.org/abs/2512.00193
- id: gpqa-diamond
  nom: GPQA Diamond
  categorie: Raisonnement scientifique
  unite: '% de bonnes réponses'
  max: 100
  mieux: haut
  auteur: NYU (Rein, Bowman et coll.), 2023 ; mesuré par Epoch AI
  provenance: Epoch AI, CC-BY 4.0
  court: 198 questions de biologie, physique et chimie de niveau doctorat, à choix multiples.
  evalue: Connaissances scientifiques et raisonnement. Questions écrites par des experts, introuvables
    sur le web pour un non-spécialiste.
  comment: 'Quatre réponses possibles, correction automatique. Le hasard donne 25 %, les doctorants du
    domaine 65 %. Epoch publie l''erreur-type : la barre affiche l''intervalle à 95 %.'
  pourquoi: Saturé chez les grands modèles, il départage encore les petits.
  classement: https://epoch.ai/benchmarks/gpqa-diamond
  article: https://arxiv.org/abs/2311.12022
- id: otis-aime
  nom: OTIS Mock AIME 2024-2025
  categorie: Mathématiques
  unite: '% de bonnes réponses'
  max: 100
  mieux: haut
  auteur: Problèmes des élèves du programme OTIS ; mesuré par Epoch AI
  provenance: Epoch AI, CC-BY 4.0
  court: 45 problèmes de concours de mathématiques, plus durs que MATH niveau 5.
  evalue: Résolution de problèmes mathématiques en plusieurs étapes, dont la réponse est un entier de
    0 à 999.
  comment: Trois examens blancs de 15 problèmes. La réponse est extraite par un modèle qui ne voit pas
    le corrigé, puis comparée exactement à la clé. Erreur-type publiée.
  pourquoi: Bon indicateur du raisonnement long, là où les petits modèles décrochent le plus.
  classement: https://epoch.ai/benchmarks/otis-mock-aime-2024-2025
  article: null
- id: lmarena-text
  nom: LMArena — texte
  categorie: Préférence humaine
  unite: points Elo
  max: null
  mieux: haut
  auteur: LMArena
  provenance: LMArena, CC-BY 4.0
  court: Des internautes comparent à l'aveugle deux réponses et votent pour la meilleure.
  evalue: 'La préférence des utilisateurs, toutes questions confondues (catégorie « overall ») : style,
    utilité, justesse perçue. Ce n''est pas une mesure de capacité.'
  comment: 'Duels anonymes ; les votes sont convertis en score (modèle de Bradley-Terry) avec un intervalle
    de confiance. Les grands modèles fermés sont dans le même classement : le rang affiché est le rang
    global.'
  pourquoi: Dit si un petit modèle est agréable à utiliser en conversation. À ne pas mélanger avec les
    scores de benchmarks.
  classement: https://lmarena.ai/leaderboard/text
  article: https://arxiv.org/abs/2403.04132
- id: vectara-hhem
  nom: Vectara — hallucinations
  categorie: Fidélité au document
  unite: '% d''hallucination'
  max: 100
  mieux: bas
  auteur: Vectara
  provenance: Vectara, Apache-2.0
  court: Taux de résumés qui affirment quelque chose d'absent du document fourni.
  evalue: 'La fidélité au texte source quand le modèle résume un document : le cœur d''un usage RAG sur
    site.'
  comment: Chaque modèle résume le même jeu de documents ; un modèle juge de Vectara (HHEM-2.3, fermé)
    note la cohérence factuelle. Pas d'intervalle de confiance.
  pourquoi: Le seul classement frais qui mesure les hallucinations des petits modèles. Le juge appartient
    à Vectara.
  classement: https://github.com/vectara/hallucination-leaderboard
  article: null
rejected:
- benchmark: Artificial Analysis — Intelligence Index et évaluations unitaires
  motif: 'Meilleure couverture SLM existante (101 modèles ouverts petits/minuscules, sorties d''août-sept.
    2026 incluses). Mais : clé requise, licence non ouverte, pas d''IC, et l''indice v5.0 est NULL pour
    99 des 101 petits modèles (seuls Qwen3.8 27B Xhigh = 20.1 et Nemotron 3 Nano 4B = 1.8 sont calculés)
    : il faut lire les scores unitaires, pas l''indice. Ingestion conditionnée à une confirmation écrite
    du droit de republier.'
- benchmark: Berkeley Function Calling Leaderboard (BFCL v4)
  motif: Dimension clé (outils) et CSV propre, mais aucun SLM de 2026 (ni Gemma 4, ni Qwen3.5/3.6/3.8,
    ni gpt-oss-20b) ; pas d'IC ; licence des données non écrite. À re-contrôler à chaque édition.
- benchmark: LiveBench (1.0 et 2.0)
  motif: 3-4 SLM seulement, exécution unique sans IC, licence absente, auteur classant un modèle maison.
- benchmark: Scale SEAL — MultiChallenge (Small Language Models)
  motif: 6 modèles, pas de données téléchargeables ni de licence.
- benchmark: HELM Capabilities
  motif: Figé depuis 11 mois, aucun SLM 2026.
- benchmark: SWE-bench (Verified, bash-only / mini-SWE-agent)
  motif: Protocole homogène retiré, soumissions d'éditeurs, peu de SLM, plus mis à jour.
- benchmark: Terminal-Bench 4.0 (tbench.ai)
  motif: Bancs trop durs pour les SLM, quasi aucun présent ; AA publie TB 2.1/4.0 sur les SLM.
- benchmark: LiveCodeBench
  motif: Abandonné depuis août 2025.
- benchmark: Open LLM Leaderboard v2
  motif: Retiré ; successeur officiel = aucun, HF renvoie vers OpenEvals/find-a-leaderboard.
- benchmark: MathArena
  motif: Académique, licence MIT, mais mathématiques seulement ; fichiers de résultats non localisés ce
    jour.
- benchmark: COLE (French Language Understanding Evaluation)
  motif: Seul classement français vivant et ouvert, mais aucun SLM 2026 et scores sur versions quantifiées.
- benchmark: Le Leaderboard (OpenLLM French Leaderboard)
  motif: Figé depuis août 2025.
