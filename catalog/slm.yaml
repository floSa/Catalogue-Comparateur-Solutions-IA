benchmarks:
- id: gpqa-diamond
  nom: GPQA Diamond
  categorie: Raisonnement scientifique
  unite: '% de bonnes réponses'
  max: 100
  mieux: haut
  auteur: NYU (Rein, Bowman et coll.), 2023 ; mesuré par Epoch AI
  provenance: Epoch AI, CC-BY 4.0
  court: 198 questions de biologie, physique et chimie de niveau doctorat, à choix multiples.
  evalue: Connaissances scientifiques et raisonnement. Questions écrites par des experts, introuvables
    sur le web pour un non-spécialiste.
  comment: 'Quatre réponses possibles, correction automatique. Le hasard donne 25 %, les doctorants du
    domaine 65 %. Epoch publie l''erreur-type : la barre affiche l''intervalle à 95 %.'
  pourquoi: Saturé chez les grands modèles, il départage encore les petits.
  classement: https://epoch.ai/benchmarks/gpqa-diamond
  article: https://arxiv.org/abs/2311.12022
  provenance_type: tiers
- id: mmlu-pro
  nom: MMLU-Pro
  categorie: Connaissances générales
  auteur: TIGER-Lab (Université de Waterloo), 2024
  court: 12 000 questions à 10 choix sur 14 disciplines (droit, santé, économie, sciences…).
  evalue: L'étendue des connaissances et le raisonnement qui les mobilise, au niveau universitaire.
  comment: 'Version durcie de MMLU : 10 réponses possibles au lieu de 4 (le hasard tombe à 10 %), questions
    triviales retirées, davantage de questions de raisonnement.'
  pourquoi: Le meilleur indicateur simple de « culture générale » d'un petit modèle, utile pour un assistant
    polyvalent.
  classement: https://huggingface.co/datasets/TIGER-Lab/MMLU-Pro
  article: https://arxiv.org/abs/2406.01574
  provenance_type: editeur
  provenance: publié par l'éditeur du modèle sur sa fiche Hugging Face
  max: 100
  mieux: haut
  unite: '% de bonnes réponses'
- id: livecodebench
  nom: LiveCodeBench
  categorie: Code
  auteur: UC Berkeley, MIT, Cornell, 2024
  court: Problèmes de programmation de concours (LeetCode, AtCoder, Codeforces) publiés après une date
    donnée.
  evalue: La génération de code correct à partir d'un énoncé, vérifiée par des tests.
  comment: 'Les problèmes sont datés : on ne garde que ceux publiés après l''entraînement du modèle, pour
    limiter la contamination. Chaque version (v5, v6…) couvre une fenêtre de dates différente : deux éditeurs
    ne mesurent pas forcément la même chose.'
  pourquoi: Le repère de code le plus cité sur les fiches des petits modèles. Comparer seulement à version
    égale (libellé au survol).
  classement: https://livecodebench.github.io/leaderboard.html
  article: https://arxiv.org/abs/2403.07974
  provenance_type: editeur
  provenance: publié par l'éditeur du modèle sur sa fiche Hugging Face
  max: 100
  mieux: haut
  unite: '% de bonnes réponses'
- id: ifbench
  nom: IFBench
  categorie: Suivi des consignes
  auteur: Ai2 (Allen Institute for AI), 2025
  court: 58 nouvelles contraintes vérifiables, différentes de celles d'IFEval.
  evalue: Le suivi de consignes inédites, pour détecter les modèles qui ont seulement appris IFEval par
    cœur.
  comment: Contraintes de forme contrôlées par programme, conçues pour ne pas recouper IFEval.
  pourquoi: Plus discriminant qu'IFEval aujourd'hui.
  classement: https://github.com/allenai/IFBench
  article: https://arxiv.org/abs/2507.02833
  provenance_type: editeur
  provenance: publié par l'éditeur du modèle sur sa fiche Hugging Face
  max: 100
  mieux: haut
  unite: '% de bonnes réponses'
- id: ifeval
  nom: IFEval
  categorie: Suivi des consignes
  auteur: Google, 2023
  court: 'Environ 500 consignes vérifiables : « plus de 400 mots », « sans virgule », « en JSON »…'
  evalue: La capacité à respecter des contraintes de forme précises, vérifiées automatiquement.
  comment: '25 types de contraintes, contrôlées par programme, sans juge. Score : part des consignes respectées
    (plusieurs variantes de calcul : strict ou souple, par consigne ou par question).'
  pourquoi: Essentiel pour un modèle intégré dans un outil (format de sortie imposé). Saturé chez beaucoup
    de modèles.
  classement: https://huggingface.co/datasets/google/IFEval
  article: https://arxiv.org/abs/2311.07911
  provenance_type: editeur
  provenance: publié par l'éditeur du modèle sur sa fiche Hugging Face
  max: 100
  mieux: haut
  unite: '% de bonnes réponses'
- id: aime26
  nom: AIME 2026
  categorie: Mathématiques
  auteur: Mathematical Association of America (épreuve réelle)
  court: Les 30 problèmes de l'AIME 2026, plus récents donc moins exposés à la contamination.
  evalue: La résolution de problèmes mathématiques difficiles, réponse entière de 0 à 999.
  comment: 'Même format que l''AIME 2025, épreuve de février 2026. 30 questions : une question vaut 3,3
    points.'
  pourquoi: Successeur de l'AIME 2025 pour les modèles récents.
  classement: https://artofproblemsolving.com/wiki/index.php/2026_AIME_I
  article: null
  provenance_type: editeur
  provenance: publié par l'éditeur du modèle sur sa fiche Hugging Face
  max: 100
  mieux: haut
  unite: '% de bonnes réponses'
- id: aime25
  nom: AIME 2025
  categorie: Mathématiques
  auteur: Mathematical Association of America (épreuve réelle)
  court: Les 30 problèmes de l'AIME 2025, concours américain de sélection pour les olympiades.
  evalue: La résolution de problèmes mathématiques difficiles, réponse entière de 0 à 999.
  comment: 'Épreuve publiée en février 2025 : les modèles entraînés après ont pu la voir. Souvent moyenne
    de plusieurs tirages ; 30 questions seulement, donc une question vaut 3,3 points.'
  pourquoi: 'Mesure le raisonnement long. Petit jeu : un écart de quelques points n''est pas significatif.'
  classement: https://artofproblemsolving.com/wiki/index.php/2025_AIME_I
  article: null
  provenance_type: editeur
  provenance: publié par l'éditeur du modèle sur sa fiche Hugging Face
  max: 100
  mieux: haut
  unite: '% de bonnes réponses'
- id: math-500
  nom: MATH-500
  categorie: Mathématiques
  auteur: OpenAI (sous-ensemble de MATH, Hendrycks et coll.), 2023
  court: 500 problèmes de mathématiques de lycée et de concours, réponse exacte attendue.
  evalue: Le calcul et le raisonnement mathématique en plusieurs étapes, de l'algèbre aux probabilités.
  comment: Sous-ensemble représentatif du jeu MATH (12 500 problèmes de concours américains) choisi par
    OpenAI. La réponse finale est comparée au corrigé.
  pourquoi: Proche de la saturation chez les grands modèles ; il départage encore les très petits.
  classement: https://huggingface.co/datasets/HuggingFaceH4/MATH-500
  article: https://arxiv.org/abs/2305.20050
  provenance_type: editeur
  provenance: publié par l'éditeur du modèle sur sa fiche Hugging Face
  max: 100
  mieux: haut
  unite: '% de bonnes réponses'
- id: epoch-eci
  nom: Epoch Capabilities Index
  categorie: Indice global
  unite: points ECI
  max: null
  mieux: haut
  auteur: Epoch AI
  provenance: Epoch AI, CC-BY 4.0
  court: Un seul chiffre qui résume plus de 50 benchmarks, avec son intervalle de confiance.
  evalue: 'La capacité générale du modèle, déduite de tous les benchmarks où il a été mesuré : mieux il
    réussit les benchmarks difficiles, plus son indice est haut.'
  comment: La difficulté de chaque benchmark est estimée statistiquement à partir des modèles mesurés
    sur plusieurs d'entre eux. Échelle linéaire calée sur Claude 3.5 Sonnet = 130 et GPT-5 = 150, sans
    maximum. Il faut au moins 4 benchmarks pour obtenir un indice.
  pourquoi: 'Le meilleur point de comparaison général entre petits modèles et avec les grands. Limite
    : Epoch ajoute les petits modèles avec plusieurs mois de retard.'
  classement: https://epoch.ai/benchmarks/eci
  article: https://arxiv.org/abs/2512.00193
  provenance_type: tiers
- id: otis-aime
  nom: OTIS Mock AIME 2024-2025
  categorie: Mathématiques
  unite: '% de bonnes réponses'
  max: 100
  mieux: haut
  auteur: Problèmes des élèves du programme OTIS ; mesuré par Epoch AI
  provenance: Epoch AI, CC-BY 4.0
  court: 45 problèmes de concours de mathématiques, plus durs que MATH niveau 5.
  evalue: Résolution de problèmes mathématiques en plusieurs étapes, dont la réponse est un entier de
    0 à 999.
  comment: Trois examens blancs de 15 problèmes. La réponse est extraite par un modèle qui ne voit pas
    le corrigé, puis comparée exactement à la clé. Erreur-type publiée.
  pourquoi: Bon indicateur du raisonnement long, là où les petits modèles décrochent le plus.
  classement: https://epoch.ai/benchmarks/otis-mock-aime-2024-2025
  article: null
  provenance_type: tiers
- id: lmarena-text
  nom: LMArena — texte
  categorie: Préférence humaine
  unite: points Elo
  max: null
  mieux: haut
  auteur: LMArena
  provenance: LMArena, CC-BY 4.0
  court: Des internautes comparent à l'aveugle deux réponses et votent pour la meilleure.
  evalue: 'La préférence des utilisateurs, toutes questions confondues (catégorie « overall ») : style,
    utilité, justesse perçue. Ce n''est pas une mesure de capacité.'
  comment: 'Duels anonymes ; les votes sont convertis en score (modèle de Bradley-Terry) avec un intervalle
    de confiance. Les grands modèles fermés sont dans le même classement : le rang affiché est le rang
    global.'
  pourquoi: Dit si un petit modèle est agréable à utiliser en conversation. À ne pas mélanger avec les
    scores de benchmarks.
  classement: https://lmarena.ai/leaderboard/text
  article: https://arxiv.org/abs/2403.04132
  provenance_type: tiers
- id: vectara-hhem
  nom: Vectara — hallucinations
  categorie: Fidélité au document
  unite: '% d''hallucination'
  max: 100
  mieux: bas
  auteur: Vectara
  provenance: Vectara, Apache-2.0
  court: Taux de résumés qui affirment quelque chose d'absent du document fourni.
  evalue: 'La fidélité au texte source quand le modèle résume un document : le cœur d''un usage RAG sur
    site.'
  comment: Chaque modèle résume le même jeu de documents ; un modèle juge de Vectara (HHEM-2.3, fermé)
    note la cohérence factuelle. Pas d'intervalle de confiance.
  pourquoi: Le seul classement frais qui mesure les hallucinations des petits modèles. Le juge appartient
    à Vectara.
  classement: https://github.com/vectara/hallucination-leaderboard
  article: null
  provenance_type: tiers
